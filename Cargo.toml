[package]
name = "valoroulette"
version = "0.1.0"
edition = "2021"
description = "Native Rust desktop roulette for VALORANT agents"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
