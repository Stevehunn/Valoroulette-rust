[package]
name = "valoroulette"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.33", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
image = "0.25"
rfd = "0.15"
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "json"] }
webbrowser = "1.0"